
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Das Holz Werk</title>

  <link rel="icon" href="/favicon.ico" sizes="any">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    .container {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-sizing: border-box;
      padding: 30px 15px 70px;
    }

    .logo {
      width: 85%;
      max-width: 800px;
      height: auto;
      display: block;
    }

    .contact {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .contact a {
      color: #666666;
      text-decoration: none;
    }

    .contact a:hover {
      color: #000000;
    }

    /* Fotobanner mit 5 Bildern */

    .gallery {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 1200px;
    margin-top: 45px;
    overflow: hidden;
  }

  .gallery img {
    width: calc((100% - 40px) / 5);
    height: auto;
    display: block;
  }
    }

    /* Impressum */

    .impressum {
      position: fixed;
      bottom: 20px;
      left: 0;
      width: 100%;
      text-align: center;
    }

    .impressum a {
      font-size: 12px;
      color: #999999;
      text-decoration: none;
    }

    .impressum a:hover {
      color: #000000;
    }

    /* Smartphone */

    @media (max-width: 600px) {
      .contact {
        flex-direction: column;
        gap: 12px;
      }

      .gallery {
        margin-top: 30px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <!-- Logo -->
    <img
      class="logo"
      src="logo.png"
      alt="Das Holz Werk"
    >

    <!-- Kontakt -->
    <div class="contact">
      <a href="tel:+4369917711083">
        +43 699 17711083
      </a>

      <a href="mailto:martin@dasholzwerk.co.at">
        martin@dasholzwerk.co.at
      </a>
    </div>

    <!-- Fotobanner -->
    <div class="gallery">
      <img src="foto1.jpg" alt="Das Holz Werk – Foto 1">
      <img src="foto2.jpg" alt="Das Holz Werk – Foto 2">
      <img src="foto3.jpg" alt="Das Holz Werk – Foto 3">
      <img src="foto4.jpg" alt="Das Holz Werk – Foto 4">
      <img src="foto5.jpg" alt="Das Holz Werk – Foto 5">
    </div>

  </main>

  <!-- Impressum -->
  <footer class="impressum">
    <a href="/impressum.html">Impressum</a>
  </footer>
</body>
</html>
